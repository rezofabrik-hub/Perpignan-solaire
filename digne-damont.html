<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site en construction — Énergie Solaire 66</title>
<meta name="robots" content="noindex, nofollow">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sun: #f59e0b;
  --sky: #0B2145;
  --sky2: #1e3a6e;
  --text: #fff;
  --accent: #fcd34d;
}

body {
  min-height: 100vh;
  background: linear-gradient(160deg, var(--sky) 0%, var(--sky2) 60%, #0f3460 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', Arial, sans-serif;
  color: var(--text);
  padding: 24px;
  text-align: center;
}

.sun {
  width: 90px;
  height: 90px;
  background: radial-gradient(circle, #fff8b0 0%, var(--sun) 55%, #ef8c00 100%);
  border-radius: 50%;
  box-shadow: 0 0 40px 12px rgba(245,158,11,0.45);
  margin: 0 auto 28px;
  animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 40px 12px rgba(245,158,11,0.45); }
  50%       { box-shadow: 0 0 70px 24px rgba(245,158,11,0.65); }
}

.badge {
  display: inline-block;
  background: rgba(245,158,11,0.18);
  border: 1.5px solid var(--sun);
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 5px 16px;
  border-radius: 999px;
  margin-bottom: 20px;
}

h1 {
  font-size: clamp(1.8rem, 5vw, 2.8rem);
  font-weight: 800;
  line-height: 1.15;
  margin-bottom: 14px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.3);
}

h1 span { color: var(--accent); }

p.sub {
  font-size: 1.05rem;
  opacity: 0.85;
  max-width: 420px;
  line-height: 1.6;
  margin: 0 auto 32px;
}

.cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: linear-gradient(90deg, var(--sun), #ef8c00);
  color: #1a0a00;
  font-size: 1.1rem;
  font-weight: 800;
  padding: 14px 32px;
  border-radius: 999px;
  text-decoration: none;
  box-shadow: 0 4px 20px rgba(245,158,11,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
  margin-bottom: 16px;
}
.cta:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(245,158,11,0.55); }

.email-link {
  display: block;
  margin-top: 12px;
  color: var(--accent);
  font-size: 0.95rem;
  text-decoration: underline;
  opacity: 0.8;
}

.mountains {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 120px;
  pointer-events: none;
  overflow: hidden;
}
.mountains svg { width: 100%; height: 100%; }

.logo-text {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  opacity: 0.6;
  white-space: nowrap;
}
</style>
</head>
<body>

<div class="logo-text">☀ SOLAIRE-66.FR</div>

<div class="sun"></div>

<div class="badge">🚧 En construction</div>

<h1>Notre site revient<br><span>très bientôt</span></h1>

<p class="sub">
  Nous améliorons notre site pour vous offrir la meilleure expérience.<br>
  Pour un devis ou une question, contactez-nous directement.
</p>

<a class="cta" href="tel:+33775769232">
  📞 07 75 76 92 32
</a>

<a class="email-link" href="mailto:contact.energiesolaire66@gmail.com">
  contact.energiesolaire66@gmail.com
</a>

<div class="mountains">
  <svg viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <polygon points="0,120 200,40 380,90 560,20 720,70 900,10 1100,60 1280,30 1440,80 1440,120" fill="rgba(11,33,69,0.8)"/>
    <polygon points="0,120 160,60 320,100 520,45 700,85 880,35 1060,75 1220,50 1440,90 1440,120" fill="rgba(11,33,69,0.5)"/>
  </svg>
</div>

</body>
</html>

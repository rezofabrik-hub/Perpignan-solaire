    <line x1="155" y1="148" x2="114" y2="93"/>
    <line x1="155" y1="148" x2="89" y2="128"/>
    <line x1="155" y1="148" x2="84" y2="165"/>
    <line x1="155" y1="148" x2="196" y2="93"/>
    <line x1="155" y1="148" x2="221" y2="128"/>
    <line x1="155" y1="148" x2="226" y2="165"/>
    <line x1="155" y1="148" x2="99" y2="194"/>
    <line x1="155" y1="148" x2="211" y2="194"/>
  </g>

  <!-- Sun semicircle (top half) -->
  <path d="M 101 148 A 54 54 0 0 1 209 148 Z" fill="#F5A623"/>

  <!-- Left mountain peak (forms left "6") -->
